name: Unit tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-unit:
    name: unit tests

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node and pnpm at the versions of mise.lock; Node 25 and newer no longer
      # bundle Corepack. pnpm then switches to the version of packageManager.
      - name: Install tools from mise.lock
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.12 # datasource=github-releases depName=jdx/mise
          install_args: node pnpm

      - name: Get pnpm cache directory
        shell: bash
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> ${GITHUB_ENV}

      - name: Use pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: ubuntu-26.04-arm-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ubuntu-26.04-arm-node-

      - name: Install pnpm dependencies
        id: install-pnpm
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        continue-on-error: true

      - name: Install pnpm dependencies (retry)
        if: steps.install-pnpm.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile

      - name: Run unit tests
        run: pnpm --color=always --stream test:unit
