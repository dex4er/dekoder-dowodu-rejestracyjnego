name: Android debug build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  android-debug:
    name: android debug build

    # x86_64, not arm: the aapt2 that the Android Gradle plugin downloads from
    # Maven has no linux-arm64 build.
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    env:
      DO_NOT_TRACK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node, pnpm and the JDK that Gradle needs, at the versions of mise.lock;
      # Node 25 and newer no longer bundle Corepack. The Android SDK comes with
      # the runner image (ANDROID_HOME).
      - name: Install tools from mise.lock
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.14 # datasource=github-releases depName=jdx/mise
          install_args: java node pnpm

      - name: Get pnpm cache directory
        shell: bash
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> "${GITHUB_ENV}"

      - name: Use pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: ubuntu-26.04-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ubuntu-26.04-node-

      - name: Use Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ubuntu-26.04-gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ubuntu-26.04-gradle-

      - name: Install pnpm dependencies
        id: install-pnpm
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        continue-on-error: true

      - name: Install pnpm dependencies (retry)
        if: steps.install-pnpm.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile

      - name: Build web app
        run: pnpm --color=always build

      - name: Sync Android project
        run: pnpm --color=always android:sync

      - name: Build debug APK
        run: pnpm --color=always android:debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
